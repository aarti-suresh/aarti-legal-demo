$kind: http-example
id: e69cad15-e988-4b9c-bf12-4d988bb0ebf4
name: Internal server error.
request:
  url: "{{baseUrl}}/matters/:matterId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: matterId
      value: <string>
      description: (Required) The unique identifier of the matter (e.g. MTR-00123).
  body:
    type: text
    content: ""
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "<integer>",
        "message": "<string>"
      }
order: 4000

$kind: http-example
id: c53a1f1d-f755-4963-8126-88b87c0d3e2d
name: Unauthorised. A valid Bearer token is required.
request:
  url: "{{baseUrl}}/matters/:matterId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: matterId
      value: <string>
      description: (Required) The unique identifier of the matter (e.g. MTR-00123).
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "<integer>",
        "message": "<string>"
      }
order: 2000

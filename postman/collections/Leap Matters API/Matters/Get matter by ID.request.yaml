$kind: http-request
name: Get matter by ID
description: Retrieves the full details of a legal matter identified by its unique matter ID. Supports all matter types including Conveyancing, Family, Commercial, and more.
url: "{{baseUrl}}/matters/:matterId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: matterId
    value: MTR-00789
    description: The unique identifier of the matter (e.g. MTR-00123).
scripts:
  - type: afterResponse
    code: |
      
      // 1. Status code is 200
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      // 2. Response has JSON content-type
      pm.test("Response has JSON content-type", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      // 3. Response body is valid JSON
      pm.test("Response body is valid JSON", function () {
          pm.response.to.be.json;
          const body = pm.response.json();
          pm.expect(body).to.be.an("object");
      });

      // 4. Schema validation
      pm.test("Schema validation", function () {
          const schema = {
              "type": "object",
              "required": ["matterId", "matterType", "status", "clientName", "assignedLawyer", "createdAt"],
              "properties": {
                  "matterId": { "type": "string" },
                  "matterType": { "type": "string" },
                  "status": { "type": "string" },
                  "clientName": { "type": "string" },
                  "assignedLawyer": { "type": "string" },
                  "createdAt": { "type": "string", "format": "date-time" }
              },
              "additionalProperties": false
          };
          pm.response.to.have.jsonSchema(schema);
      });

      // 5. matterId is present and non-empty
      pm.test("matterId is present and non-empty", function () {
          const body = pm.response.json();
          pm.expect(body.matterId).to.be.a("string").and.to.have.length.above(0);
      });

      // 6. matterType is a known value
      pm.test("matterType is a known value", function () {
          const body = pm.response.json();
          const validMatterTypes = ["Conveyancing", "Family", "Commercial", "Criminal", "Employment", "Other"];
          pm.expect(validMatterTypes).to.include(body.matterType);
      });

      // 7. status is a known value
      pm.test("status is a known value", function () {
          const body = pm.response.json();
          const validStatuses = ["Open", "Closed", "Pending", "Archived"];
          pm.expect(validStatuses).to.include(body.status);
      });

      // 8. createdAt is a valid ISO 8601 date-time
      pm.test("createdAt is a valid ISO 8601 date-time", function () {
          const body = pm.response.json();
          const date = new Date(body.createdAt);
          pm.expect(date.toString()).to.not.equal("Invalid Date");
      });
    language: text/javascript
examples: ./.resources/Get matter by ID.resources/examples
order: 1000

$kind: http-example
name: Unauthorised. A valid Bearer token is required.
request:
  url: "{{baseUrl}}/matters/:matterId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: matterId
      value: MTR-00123
      description: The unique identifier of the matter (e.g. MTR-00123).
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": 401,
        "message": "Unauthorised. A valid Bearer token is required."
      }
    $type: |-
      {
        "description": "Standard error response returned for 4xx and 5xx status codes.",
        "type": "object",
        "properties": {
          "code": {
            "type": "integer",
            "example": 404,
            "description": "HTTP status code."
          },
          "message": {
            "type": "string",
            "example": "Matter MTR-99999 was not found.",
            "description": "Human-readable error message."
          }
        },
        "required": [
          "code",
          "message"
        ]
      }
order: 3000

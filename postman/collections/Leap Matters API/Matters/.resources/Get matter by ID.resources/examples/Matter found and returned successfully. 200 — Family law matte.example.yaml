$kind: http-example
name: Matter found and returned successfully. 200 — Family law matter
request:
  url: "{{baseUrl}}/matters/:matterId"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    - key: matterId
      value: MTR-00456
      description: The unique identifier of the matter (e.g. MTR-00123).
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "matterId": "MTR-00456",
        "matterType": "Family",
        "status": "Pending",
        "clientName": "Mark and Lisa Brennan",
        "assignedLawyer": "Sarah Okafor",
        "createdAt": "2026-05-01T10:15:00Z"
      }
    $type: |-
      {
        "description": "Represents a legal matter in the LEAP Dev system.",
        "type": "object",
        "properties": {
          "matterId": {
            "type": "string",
            "example": "MTR-00123",
            "description": "Unique identifier for the matter."
          },
          "matterType": {
            "type": "string",
            "enum": [
              "Conveyancing",
              "Family",
              "Commercial",
              "Criminal",
              "Other"
            ],
            "example": "Conveyancing",
            "description": "The type/category of the legal matter."
          },
          "status": {
            "type": "string",
            "enum": [
              "Open",
              "Pending",
              "Closed",
              "Archived"
            ],
            "example": "Open",
            "description": "Current status of the matter."
          },
          "clientName": {
            "type": "string",
            "example": "Jane Smith",
            "description": "Full name of the client associated with the matter."
          },
          "assignedLawyer": {
            "type": "string",
            "example": "Robert Hughes",
            "description": "Full name of the lawyer assigned to the matter."
          },
          "createdAt": {
            "type": "string",
            "example": "2026-03-15T09:00:00Z",
            "description": "ISO 8601 timestamp of when the matter was created.",
            "format": "date-time"
          }
        },
        "required": [
          "matterId",
          "matterType",
          "status",
          "clientName",
          "assignedLawyer",
          "createdAt"
        ]
      }
order: 2000
